<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="간편 계산기">
  <link rel="manifest" href="manifest.webmanifest">
  <title>간편 계산기</title>
  <!-- v3.2 -->
  <style>
    :root{--bg:#f4f4f4;--card:#fff;--text:#202124;--muted:#737373;--line:#dedede;--dark:#30343b;--warn:#b42318;--warnbg:#fff1f1}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    .wrap{width:min(100%,540px);margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
    h1{text-align:center;font-size:21px;margin:4px 0 14px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
    .tab{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 3px;font-size:12px;font-weight:800}
    .tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
    .card{background:var(--card);border-radius:16px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:11px}
    .row{margin-bottom:12px}.row:last-child{margin-bottom:0}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:800;margin-bottom:6px}
    label small{font-size:11px;color:var(--muted);font-weight:500}
    input,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 12px;font-size:18px;background:#fff;color:var(--text)}
    button{touch-action:manipulation}
    .calc{width:100%;border:0;border-radius:12px;padding:15px;background:var(--dark);color:#fff;font-size:17px;font-weight:900}
    .state-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .state-head strong{font-size:14px}.state-head span{font-size:11px;color:var(--muted)}
    .state-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .state-box{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fafafa}
    .state-box .k{font-size:11px;color:var(--muted);margin-bottom:3px}.state-box .v{font-size:16px;font-weight:900;word-break:break-all}
    .result{display:none}.result.show{display:block}
    .primary{text-align:center;padding:7px 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
    .primary .t{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}
    .primary .n{font-size:37px;font-weight:950;letter-spacing:-1px;word-break:break-all}
    .primary .u{font-size:13px;color:var(--muted);font-weight:800}
    .summary{display:grid;gap:8px;font-size:13px}.summary>div{display:flex;justify-content:space-between;gap:10px}.summary strong{text-align:right}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
    .actions button{border-radius:11px;padding:12px;font-weight:850;font-size:14px}
    .copy{border:1px solid var(--dark);background:#fff;color:var(--dark)}
    .save{border:0;background:var(--dark);color:#fff}
    .warning{display:none;margin-top:11px;padding:10px 11px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:750;line-height:1.5}
    .warning.show{display:block}.hidden{display:none!important}
    .note{text-align:center;color:var(--muted);font-size:11px;line-height:1.55;margin:8px 2px}
    .compare-positive{color:#b42318}.compare-negative{color:#177245}.compare-neutral{color:var(--text)}
  </style>
</head>
<body>
<main class="wrap">
  <h1>간편 계산기</h1>

  <section class="card">
    <div class="state-head"><strong>현재값</strong><span>이 기기에만 저장</span></div>
    <div class="two">
      <div class="row">
        <label for="asset">표시 단위</label>
        <select id="asset"><option value="BTC">BTC</option><option value="ETH">ETH</option></select>
      </div>
      <div class="row">
        <label for="balance">기준금액</label>
        <input id="balance" type="number" inputmode="decimal" step="any" value="4000">
      </div>
    </div>
    <div class="two">
      <div class="row"><label for="manualQty">현재 수량</label><input id="manualQty" type="number" inputmode="decimal" step="any" placeholder="거래소 보유수량"></div>
      <div class="row"><label for="manualAvg">현재 평균값</label><input id="manualAvg" type="number" inputmode="decimal" step="any" placeholder="거래소 평단"></div>
    </div>
    <button class="calc" id="manualSave" type="button">현재값 저장</button>
    <div class="state-grid" style="margin-top:10px">
      <div class="state-box"><div class="k">저장 수량</div><div class="v" id="stateQty">0</div></div>
      <div class="state-box"><div class="k">저장 평균값</div><div class="v" id="stateAvg">0</div></div>
      <div class="state-box" style="grid-column:1/-1"><div class="k">현재 증거금 비중</div><div class="v" id="stateRatio">0%</div></div>
    </div>
  </section>

  <section class="card">
    <div class="state-head"><strong>기준값</strong><span>종목별로 저장</span></div>
    <div class="two">
      <div class="row"><label for="leaderQty">기준 수량</label><input id="leaderQty" type="number" inputmode="decimal" step="any" placeholder="공개 수량"></div>
      <div class="row"><label for="leaderRatio">기준 비율 (%)</label><input id="leaderRatio" type="number" inputmode="decimal" step="any" placeholder="예: 0.67"></div>
    </div>
    <div class="row"><label for="leaderAvg">기준 평균값</label><input id="leaderAvg" type="number" inputmode="decimal" step="any" placeholder="공개 평단"></div>
    <button class="calc" id="leaderSave" type="button">기준값 저장</button>
    <div class="state-grid" style="margin-top:10px">
      <div class="state-box"><div class="k">기준 비율</div><div class="v" id="leaderRatioView">0%</div></div>
      <div class="state-box"><div class="k">내 목표비율</div><div class="v" id="targetRatioView">0%</div></div>
      <div class="state-box"><div class="k">내 현재비율</div><div class="v" id="myRatioCompare">0%</div></div>
      <div class="state-box"><div class="k">목표 대비</div><div class="v" id="ratioGapView">0%p</div></div>
      <div class="state-box"><div class="k">기준 평균값</div><div class="v" id="leaderAvgView">0</div></div>
      <div class="state-box"><div class="k">평균값 차이</div><div class="v" id="avgGapView">0</div></div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-mode="basic">기본</button>
    <button class="tab" data-mode="diff">차이</button>
    <button class="tab" data-mode="average">평균</button>
    <button class="tab" data-mode="reduce">정리</button>
  </div>

  <section class="card">
    <div id="commonFields">
      <div class="two">
        <div class="row"><label for="multiplier">배율</label><input id="multiplier" type="number" inputmode="decimal" step="any" value="1.3"></div>
        <div class="row"><label for="leverage">배수값</label><input id="leverage" type="number" inputmode="decimal" step="any" value="50"></div>
      </div>
    </div>

    <div id="basicFields">
      <div class="two">
        <div class="row"><label for="ratio">비율 (%)</label><input id="ratio" type="number" inputmode="decimal" step="any" placeholder="예: 0.27"></div>
        <div class="row"><label for="price">기준값</label><input id="price" type="number" inputmode="decimal" step="any" placeholder="진입가격"></div>
      </div>
    </div>

    <div id="diffFields" class="hidden">
      <div class="two">
        <div class="row"><label for="diffRatio">전체 비율 (%)</label><input id="diffRatio" type="number" inputmode="decimal" step="any" placeholder="예: 1.36"></div>
        <div class="row"><label for="diffPrice">기준값</label><input id="diffPrice" type="number" inputmode="decimal" step="any" placeholder="추가가격"></div>
      </div>
      <div class="row"><label for="diffCurrentQty">현재 수량</label><input id="diffCurrentQty" type="number" inputmode="decimal" step="any"></div>
    </div>

    <div id="averageFields" class="hidden">
      <div class="row"><label for="avgCurrentQty">현재 수량</label><input id="avgCurrentQty" type="number" inputmode="decimal" step="any"></div>
      <div class="two">
        <div class="row"><label for="myAverage">현재 평균값</label><input id="myAverage" type="number" inputmode="decimal" step="any" placeholder="내 평단"></div>
        <div class="row"><label for="targetAverage">목표 평균값</label><input id="targetAverage" type="number" inputmode="decimal" step="any" placeholder="맞출 평단"></div>
      </div>
      <div class="row"><label for="addPrice">추가 기준값</label><input id="addPrice" type="number" inputmode="decimal" step="any" placeholder="지금 추가할 가격"></div>
    </div>

    <div id="reduceFields" class="hidden">
      <div class="two">
        <div class="row"><label for="reduceRatio">리더 정리 전 총비율 (%)</label><input id="reduceRatio" type="number" inputmode="decimal" step="any" placeholder="예: 1.00"></div>
        <div class="row"><label for="reducePercent">리더 정리 비율 (%)</label><input id="reducePercent" type="number" inputmode="decimal" step="any" placeholder="예: 50"></div>
      </div>
      <div class="two">
        <div class="row"><label for="reduceCurrentQty">현재 내 수량</label><input id="reduceCurrentQty" type="number" inputmode="decimal" step="any"></div>
        <div class="row"><label for="reduceCurrentAvg">현재 내 평균값</label><input id="reduceCurrentAvg" type="number" inputmode="decimal" step="any"></div>
      </div>
      <p class="note">리더 정리 후 비율의 1.3배만 남도록, 평단 맞추기로 늘어난 수량까지 포함해 정리값을 계산합니다.</p>
    </div>

    <button class="calc" id="calculate">계산</button>
  </section>

  <section class="card result" id="resultCard">
    <div class="primary">
      <div class="t" id="resultTitle">결과값</div>
      <div class="n" id="resultQty">0</div>
      <div class="u" id="resultUnit">BTC</div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="warning" id="warning"></div>
    <div class="actions">
      <button class="copy" id="copyBtn">결과 복사</button>
      <button class="save" id="saveBtn">계산 후 값 저장</button>
    </div>
  </section>

  <p class="note">0.67%는 0.67로 입력하세요. 기준값은 공개된 수량·비율·평균값을 그대로 저장하세요. 주문 전 결과를 재확인하세요.</p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let mode = "basic";
  let pendingState = null;

  const settings = JSON.parse(localStorage.getItem("simpleCalcSettingsV3") || "{}");
  const states = JSON.parse(localStorage.getItem("simpleCalcPositionV3") || '{"BTC":{"qty":0,"avg":0},"ETH":{"qty":0,"avg":0}}');
  const leaderStates = JSON.parse(localStorage.getItem("simpleCalcLeaderV32") || '{"BTC":{"qty":0,"ratio":0,"avg":0},"ETH":{"qty":0,"ratio":0,"avg":0}}');
  if (settings.balance) $("balance").value = settings.balance;
  if (settings.multiplier) $("multiplier").value = settings.multiplier;
  if (settings.leverage) $("leverage").value = settings.leverage;
  if (settings.asset) $("asset").value = settings.asset;

  function num(id){ return Number(String($(id).value || "").replace(/,/g,"")); }
  function validPos(...xs){ return xs.every(x => Number.isFinite(x) && x > 0); }
  function fmt(x,d=8){ return new Intl.NumberFormat("en-US",{maximumFractionDigits:d}).format(x); }
  function digits(){ return $("asset").value === "BTC" ? 6 : 5; }
  function state(){ return states[$("asset").value] || {qty:0,avg:0}; }
  function leaderState(){ return leaderStates[$("asset").value] || {qty:0,ratio:0,avg:0}; }
  function updateStateView(){
    const s=state();
    $("stateQty").textContent=fmt(s.qty,digits())+" "+$("asset").value;
    $("stateAvg").textContent=fmt(s.avg,8);
    $("manualQty").value=s.qty || "";
    $("manualAvg").value=s.avg || "";
    const bal=num("balance"), lev=num("leverage");
    const ratio=(bal>0 && lev>0 && s.qty>0 && s.avg>0) ? (s.qty*s.avg/lev/bal*100) : 0;
    $("stateRatio").textContent=fmt(ratio,4)+"%";
    $("diffCurrentQty").value=s.qty || "";
    $("avgCurrentQty").value=s.qty || "";
    $("myAverage").value=s.avg || "";
    $("reduceCurrentQty").value=s.qty || "";
    $("reduceCurrentAvg").value=s.avg || "";

    const ls=leaderState();
    $("leaderQty").value=ls.qty || "";
    $("leaderRatio").value=ls.ratio || "";
    $("leaderAvg").value=ls.avg || "";
    $("leaderRatioView").textContent=fmt(ls.ratio,4)+"%";
    const target=ls.ratio>0 ? ls.ratio*num("multiplier") : 0;
    $("targetRatioView").textContent=fmt(target,4)+"%";
    $("myRatioCompare").textContent=fmt(ratio,4)+"%";
    const gap=ratio-target;
    $("ratioGapView").textContent=(gap>0?"+":"")+fmt(gap,4)+"%p";
    $("ratioGapView").className="v "+(gap>0?"compare-positive":gap<0?"compare-negative":"compare-neutral");
    $("leaderAvgView").textContent=fmt(ls.avg,8);
    const avgGap=(s.avg>0 && ls.avg>0)?s.avg-ls.avg:0;
    $("avgGapView").textContent=(avgGap>0?"+":"")+fmt(avgGap,8);
    $("avgGapView").className="v "+(avgGap>0?"compare-positive":avgGap<0?"compare-negative":"compare-neutral");

    if(ls.avg>0) $("targetAverage").value=ls.avg;
    if(ls.ratio>0){
      $("ratio").value=ls.ratio;
      $("diffRatio").value=ls.ratio;
      $("reduceRatio").value=ls.ratio;
    }
  }
  function saveSettings(){
    localStorage.setItem("simpleCalcSettingsV3",JSON.stringify({
      balance:$("balance").value,multiplier:$("multiplier").value,
      leverage:$("leverage").value,asset:$("asset").value
    }));
  }
  ["balance","multiplier","leverage","asset"].forEach(id=>$(id).addEventListener("change",()=>{saveSettings();updateStateView()}));

  $("manualSave").addEventListener("click",()=>{
    const q=num("manualQty"), a=num("manualAvg");
    if(!(Number.isFinite(q)&&q>=0) || !(Number.isFinite(a)&&a>=0)) return alert("현재 수량과 평균값을 정확히 입력하세요.");
    if((q===0)!==(a===0)) return alert("포지션이 없으면 수량과 평균값을 모두 0으로 입력하세요.");
    states[$("asset").value]={qty:q,avg:a};
    localStorage.setItem("simpleCalcPositionV3",JSON.stringify(states));
    updateStateView();
    $("manualSave").textContent="저장됨";
    setTimeout(()=>$("manualSave").textContent="현재값 저장",1100);
  });

  $("leaderSave").addEventListener("click",()=>{
    const q=num("leaderQty"), r=num("leaderRatio"), a=num("leaderAvg");
    if(!(Number.isFinite(q)&&q>=0) || !(Number.isFinite(r)&&r>=0) || !(Number.isFinite(a)&&a>=0)) return alert("기준 수량·비율·평균값을 정확히 입력하세요.");
    if((q===0 || r===0 || a===0) && !(q===0 && r===0 && a===0)) return alert("기준값은 세 항목을 모두 입력하거나 모두 0으로 입력하세요.");
    leaderStates[$("asset").value]={qty:q,ratio:r,avg:a};
    localStorage.setItem("simpleCalcLeaderV32",JSON.stringify(leaderStates));
    updateStateView();
    $("leaderSave").textContent="저장됨";
    setTimeout(()=>$("leaderSave").textContent="기준값 저장",1100);
  });

  updateStateView();

  document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
    mode=btn.dataset.mode;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
    ["basic","diff","average","reduce"].forEach(m=>$(m+"Fields").classList.toggle("hidden",m!==mode));
    $("commonFields").classList.toggle("hidden",mode==="average");
    $("resultCard").classList.remove("show");
    pendingState=null;
  }));

  function showResult(title, value, rows, warnings, nextState){
    $("resultTitle").textContent=title;
    $("resultQty").textContent=fmt(value,digits());
    $("resultUnit").textContent=$("asset").value;
    $("summary").innerHTML=rows.map(([k,v])=>`<div><span>${k}</span><strong>${v}</strong></div>`).join("");
    const w=$("warning");
    if(warnings.length){w.innerHTML="⚠ "+warnings.join("<br>⚠ ");w.classList.add("show")}else{w.classList.remove("show");w.textContent=""}
    pendingState=nextState;
    $("saveBtn").disabled=!nextState;
    $("resultCard").classList.add("show");
    $("resultCard").scrollIntoView({behavior:"smooth",block:"start"});
  }

  $("calculate").addEventListener("click",()=>{
    const asset=$("asset").value, balance=num("balance"), mult=num("multiplier"), lev=num("leverage");
    let warnings=[], result=0, rows=[], next=null;

    if(mode==="basic"){
      const ratio=num("ratio"), price=num("price");
      if(!validPos(balance,mult,lev,ratio,price)) return alert("입력값을 모두 정확히 입력하세요.");
      const applied=ratio*mult, margin=balance*applied/100, position=margin*lev;
      result=position/price;
      next={qty:result,avg:price};
      rows=[["적용 비율",fmt(applied,6)+"%"],["사용 금액",fmt(margin,2)+" USDT"],["전체 금액",fmt(position,2)+" USDT"],["계산 후 평균값",fmt(price,8)]];
      if(ratio>=1) warnings.push("입력 비율이 1% 이상입니다.");
      showResult("결과값",result,rows,warnings,next);
    }

    if(mode==="diff"){
      const ratio=num("diffRatio"), price=num("diffPrice"), current=num("diffCurrentQty");
      if(!validPos(balance,mult,lev,ratio,price) || !(Number.isFinite(current)&&current>=0)) return alert("입력값을 모두 정확히 입력하세요.");
      const applied=ratio*mult, margin=balance*applied/100, target=margin*lev/price;
      result=Math.max(0,target-current);
      const old=state(), oldAvg=(old.qty===current?old.avg:0);
      const newQty=current+result;
      const newAvg=newQty>0?((current*oldAvg)+(result*price))/newQty:0;
      next={qty:newQty,avg:newAvg};
      rows=[["목표 전체수량",fmt(target,digits())+" "+asset],["현재 수량",fmt(current,digits())+" "+asset],["계산 후 수량",fmt(newQty,digits())+" "+asset],["사용 금액",fmt(result*price/lev,2)+" USDT"]];
      if(target<=current) warnings.push("현재 수량이 목표수량 이상이라 추가값은 0입니다.");
      if(!oldAvg) warnings.push("저장 평균값과 현재 수량이 다르면 계산 후 평균값은 저장하지 않는 편이 안전합니다.");
      showResult("이번 차이값",result,rows,warnings,next);
    }

    if(mode==="average"){
      const q=num("avgCurrentQty"), a=num("myAverage"), t=num("targetAverage"), p=num("addPrice");
      if(!validPos(q,a,t,p)) return alert("입력값을 모두 정확히 입력하세요.");
      const den=t-p, nume=q*(a-t);
      if(Math.abs(den)<1e-12) return alert("추가 기준값이 목표 평균값과 같아 계산할 수 없습니다.");
      result=nume/den;
      if(!Number.isFinite(result)||result<0) return alert("현재 가격 위치에서는 목표 평균값에 맞출 수 없습니다.");
      const total=q+result, avg=(q*a+result*p)/total;
      next={qty:total,avg:avg};
      const afterRatio=total*avg/num("leverage")/num("balance")*100;
      const ls=leaderState(), targetRatio=ls.ratio*num("multiplier");
      rows=[["계산 후 전체수량",fmt(total,digits())+" "+asset],["계산 후 평균값",fmt(avg,8)],["계산 후 내 비율",fmt(afterRatio,4)+"%"],["기준 목표비율",fmt(targetRatio,4)+"%"],["목표 초과",fmt(Math.max(0,afterRatio-targetRatio),4)+"%p"],["추가 사용금액",fmt(result*p/num("leverage"),2)+" USDT"]];
      if(result>q) warnings.push("추가수량이 현재 수량보다 큽니다.");
      if(result>q*2) warnings.push("추가수량이 현재 수량의 2배를 넘습니다.");
      showResult("필요한 추가값",result,rows,warnings,next);
    }

    if(mode==="reduce"){
      const leaderBefore=num("reduceRatio"), pct=num("reducePercent"), current=num("reduceCurrentQty"), currentAvg=num("reduceCurrentAvg");
      if(!validPos(balance,mult,lev,leaderBefore,pct,current,currentAvg) || pct>100) return alert("입력값을 모두 정확히 입력하세요. 정리 비율은 100 이하입니다.");
      const leaderAfter=leaderBefore*(1-pct/100);
      const myTargetRatio=leaderAfter*mult;
      const currentRatio=current*currentAvg/lev/balance*100;
      const targetRemain=(balance*myTargetRatio/100*lev)/currentAvg;
      result=Math.max(0,current-targetRemain);
      const actualPct=current>0?result/current*100:0;
      next={qty:Math.max(0,current-result),avg:currentAvg};
      rows=[["리더 정리 후 총비율",fmt(leaderAfter,4)+"%"],["내 목표비율 ("+fmt(mult,2)+"배)",fmt(myTargetRatio,4)+"%"],["내 현재 실제비율",fmt(currentRatio,4)+"%"],["덜어낼 비율",fmt(Math.max(0,currentRatio-myTargetRatio),4)+"%p"],["내 실제 정리 비율",fmt(actualPct,2)+"%"],["정리 후 남길 수량",fmt(targetRemain,digits())+" "+asset]];
      if(currentRatio<=myTargetRatio) warnings.push("현재 비중이 목표비중 이하라 정리값은 0입니다.");
      if(actualPct>pct+5) warnings.push("리더보다 더 많이 덜어내는 계산입니다. 평단 맞추기로 늘어난 비중을 정상화하는 값입니다.");
      if(actualPct>=80) warnings.push("실제 정리 비율이 80% 이상입니다. 입력값을 다시 확인하세요.");
      showResult("이번 정리값",result,rows,warnings,next);
    }
    saveSettings();
  });

  $("copyBtn").addEventListener("click",async()=>{
    const text=$("resultQty").textContent.replace(/,/g,"");
    try{await navigator.clipboard.writeText(text);$("copyBtn").textContent="복사됨";setTimeout(()=>$("copyBtn").textContent="결과 복사",1100)}
    catch{alert("복사가 되지 않았습니다. 숫자를 길게 눌러 복사하세요.")}
  });

  $("saveBtn").addEventListener("click",()=>{
    if(!pendingState) return;
    if(!confirm("계산 후 수량과 평균값을 현재값으로 저장할까요? 실제 주문을 완료한 뒤에만 저장하세요.")) return;
    states[$("asset").value]=pendingState;
    localStorage.setItem("simpleCalcPositionV3",JSON.stringify(states));
    updateStateView();
    $("saveBtn").textContent="저장됨";
    setTimeout(()=>$("saveBtn").textContent="계산 후 값 저장",1100);
  });

  if("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
})();
</script>
</body>
</html>
